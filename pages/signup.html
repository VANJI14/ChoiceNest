<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up | ChoiceNest</title><link rel="stylesheet" href="../css/style.css"></head>
<body><header class="site-header"><a class="logo" href="../index.html">Choice<span>Nest</span></a><nav><a href="../index.html">Home</a><a href="products.html">Products</a><a href="login.html">Login</a></nav></header>
<main class="auth-wrap"><section class="auth-card"><p class="eyebrow">JOIN CHOICENEST</p><h1>Create account</h1><form id="signupForm" class="form"><label>Full name<input id="name" required placeholder="Your name"></label><label>Email<input id="email" type="email" required placeholder="you@example.com"></label><label>Password<input id="password" type="password" minlength="6" required placeholder="At least 6 characters"></label><div id="error" class="form-error"></div><button class="btn btn-primary">Create Account</button></form><p style="margin-top:18px;color:#716e80">Already have an account? <a href="login.html" style="color:#6c4df6;font-weight:700">Login</a></p></section></main>
<script>
document.getElementById("signupForm").addEventListener("submit",e=>{e.preventDefault();const user={id:Date.now(),name:document.getElementById("name").value,email:document.getElementById("email").value,password:document.getElementById("password").value,favorites:[],saved:[],recentlyViewed:[],createdAt:new Date().toISOString()};localStorage.setItem("cn_user",JSON.stringify(user));localStorage.setItem("cn_logged_in","true");location.href="profile.html"});
</script></body></html>
